# Every dependency is hard-pinned (a deliberate choice for a pipx-isolated
# tool), which means a CVE in a pin is invisible until someone looks. This
# looks weekly: pip-audit checks every pinned requirement against the Python
# advisory databases and fails loudly when one is affected, which files the
# "cut a patch release" work the pinning policy in SECURITY.md promises.
# Scheduled rather than per-push so a new advisory in an unrelated dependency
# cannot break an unrelated pull request; run it on demand with
# workflow_dispatch when triaging.
name: Dependency advisories

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Known advisories in pinned dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Audit the runtime pins
        run: |
          python -m pip install pip-audit==2.10.0
          # --no-deps: audit exactly the recorded pins, resolving nothing new.
          pip-audit --no-deps -r requirements.txt

      - name: Audit the development pins
        if: always()
        run: pip-audit --no-deps -r requirements-dev.txt
