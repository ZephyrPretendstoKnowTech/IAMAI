# Builds the wheel for a published release and attaches it, so the installer
# can prefer a pinned, name-carrying wheel over rebuilding from a source
# archive. SOURCE_DATE_EPOCH is pinned to the release commit's own timestamp
# so two builds of the same tag produce byte-identical wheels, and the SHA256
# is appended to the release notes so "verify what you downloaded" has a
# recorded value to verify against.
name: Release wheel

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  wheel:
    name: Build and attach wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Build a reproducible wheel
        run: |
          python -m pip install build==1.3.0
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python -m build --wheel
          ls -l dist/

      - name: Record the hash and attach the wheel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          WHEEL="$(ls dist/iamai-*.whl)"
          HASH="$(sha256sum "$WHEEL" | cut -d' ' -f1)"
          sha256sum "$WHEEL" > "$WHEEL.sha256"
          gh release upload "$TAG" "$WHEEL" "$WHEEL.sha256" --clobber
          # Append the hash to the release notes rather than replacing them.
          gh release view "$TAG" --json body --jq .body > notes.md
          printf '\n**Wheel SHA256**: `%s` (`%s`)\n' "$HASH" "$(basename "$WHEEL")" >> notes.md
          gh release edit "$TAG" --notes-file notes.md
