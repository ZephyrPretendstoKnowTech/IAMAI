# Secret scanning configuration.
#
# This repository is intended to go public, so the whole history is readable by
# anyone. Nothing here relaxes what counts as a secret: certificates, private
# keys and client secrets are all still caught by the default rules, and none
# has ever been committed (certs/, config.yaml and data/ are gitignored and
# absent from every commit).
#
# The one adjustment is for bare GUIDs, explained below.

[extend]
useDefault = true

[[rules]]
# The default generic-api-key rule treats a bare GUID as a candidate secret.
# In this project a GUID is never a credential. Every GUID that reaches a
# tracked file is one of three things:
#
#   1. A published Microsoft constant, such as the guest role template ids in
#      ASSUMPTIONS.md note 30 or the Global Administrator role template id.
#      These are documented on Microsoft Learn and are the same in every
#      tenant in the world.
#   2. A pseudonym generated by the sanitizer, in tests/fixtures/. The
#      sanitizer replaces every GUID shaped value that is not a documented
#      universal constant, so a GUID in a sanitized fixture is by construction
#      not a tenant's real identifier.
#   3. A synthetic value written by hand for a test.
#
# An Entra client secret is not GUID shaped, so this does not weaken the check
# that matters. Object ids and application ids are identifiers rather than
# credentials: knowing one grants nothing without a credential to go with it.
id = "generic-api-key"
description = "Generic API key, with bare GUIDs allowed"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    # A standalone GUID, in any casing.
    '''[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}''',
  ]

[allowlist]
description = "Paths that cannot contain a real secret"
paths = [
  # Recorded Graph responses that have been through the sanitizer, plus
  # hand written synthetic fixtures. No live credential is ever written here.
  '''tests/fixtures/''',
  # This file describes what a secret looks like, so it contains examples.
  '''\.gitleaks\.toml$''',
]
